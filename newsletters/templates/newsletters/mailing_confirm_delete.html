{% extends 'catalog/base.html' %}

{% block title %}Удаление рассылки{% endblock %}

{% block content %}
    <div class="container">
        <h1>Удалить рассылку</h1>
        <p>Вы уверены, что хотите удалить рассылку "{{ mailing.title }}"?</p>
        <form method="POST">
            {% csrf_token %}
            <button type="submit" class="btn btn-danger">Удалить</button>
            <a href="{% url 'mailing_list' %}" class="btn btn-secondary">Отмена</a>
        </form>
    </div>
{% endblock %}
