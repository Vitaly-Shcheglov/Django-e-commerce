{% extends 'catalog/base.html' %}

{% block title %}Детали получателя{% endblock %}

{% block content %}
    <div class="container">
        <h1>Детали получателя</h1>
        <p><strong>ФИО:</strong> {{ recipient.full_name }}</p>
        <p><strong>Email:</strong> {{ recipient.email }}</p>
        <p><strong>Комментарий:</strong> {{ recipient.comment }}</p>

        <a href="{% url 'edit_recipient' recipient.id %}" class="btn btn-secondary">Изменить</a>
        <form action="{% url 'delete_recipient' recipient.id %}" method="POST" style="display:inline;">
            {% csrf_token %}
            <button type="submit" class="btn btn-danger">Удалить</button>
        </form>
        <a href="{% url 'recipient_list' %}" class="btn btn-primary">Назад к списку получателей</a>
    </div>
{% endblock %}
