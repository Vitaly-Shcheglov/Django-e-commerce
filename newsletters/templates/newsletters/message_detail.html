{% extends 'catalog/base.html' %}

{% block title %}Детали сообщения{% endblock %}

{% block content %}
    <div class="container">
        <h1>{{ message.subject }}</h1>
        <p>{{ message.body }}</p>
        <p>Дата создания: {{ message.created_at }}</p>
        <a href="{% url 'edit_message' message.id %}" class="btn btn-secondary">Изменить</a>
        <form action="{% url 'delete_message' message.id %}" method="POST" style="display:inline;">
            {% csrf_token %}
            <button type="submit" class="btn btn-danger">Удалить</button>
        </form>
        <a href="{% url 'message_list' %}" class="btn btn-primary mt-3">Назад к списку сообщений</a>
    </div>
{% endblock %}
