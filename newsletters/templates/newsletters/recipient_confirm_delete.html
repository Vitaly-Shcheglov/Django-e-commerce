{% extends 'catalog/base.html' %}

{% block title %}Удаление пользователя{% endblock %}

{% block content %}
    <div class="container">
        <h1>Удалить пользователя</h1>
        <p>Вы уверены, что хотите удалить получателя "{{ recipient.full_name }}"?</p>
        <form method="POST">
            {% csrf_token %}
            <button type="submit" class="btn btn-danger">Удалить</button>
            <a href="{% url 'recipient_list' %}" class="btn btn-secondary">Отмена</a>
        </form>
    </div>
{% endblock %}
