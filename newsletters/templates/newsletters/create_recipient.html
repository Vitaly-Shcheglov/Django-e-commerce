 {% extends 'catalog/base.html' %}

{% block title %}Добавить получателя{% endblock %}

{% block content %}
    <div class="container">
        <h1>Добавить получателя</h1>
        <form method="POST">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn btn-primary">Сохранить</button>
        </form>
        <a href="{% url 'recipient_list' %}" class="btn btn-secondary mt-3">Назад к списку</a>
    </div>
{% endblock %}
