{% extends 'catalog/base.html' %}

{% block title %}Удаление сообщения{% endblock %}

{% block content %}
    <div class="container">
        <h1>Удалить сообщение</h1>
        <p>Вы уверены, что хотите удалить "{{ message.subject }}"?</p>
        <form method="POST">
            {% csrf_token %}
            <button type="submit" class="btn btn-danger">Удалить</button>
            <a href="{% url 'message_detail' message.id %}" class="btn btn-secondary">Отмена</a>
        </form>
    </div>
{% endblock %}
