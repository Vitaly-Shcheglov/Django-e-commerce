{% extends 'catalog/base.html' %}

{% block title %}Список рассылок{% endblock %}

{% block content %}
    <div class="container">
        <h1>Список рассылок</h1>
        <ul class="list-group">
            {% for mailing in mailings %}
                <li class="list-group-item d-flex justify-content-between align-items-center">
                    <a href="{% url 'mailing_list' mailing.id %}">{{ mailing.subject }}</a>
                </li>
            {% empty %}
                <li class="list-group-item">Нет рассылок.</li>
            {% endfor %}
        </ul>
        <a href="{% url 'create_mailing' %}" class="btn btn-primary mt-3">Создать новую рассылку</a>
        <a href="{% url 'home' %}" class="btn btn-secondary mt-3">Назад на главную</a>
    </div>
{% endblock %}
