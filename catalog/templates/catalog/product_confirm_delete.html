{% extends 'catalog/base.html' %}

{% block title %}Удаление продукта{% endblock %}

{% block content %}
    <div class="container">
        <h1>Удалить продукт</h1>
        <p>Вы уверены, что хотите удалить "{{ product.name }}"?</p>
        <form method="POST">
            {% csrf_token %}
            <button type="submit" class="btn btn-danger">Удалить</button>
            <a href="{% url 'product_detail' product.pk %}" class="btn btn-secondary">Отмена</a>
        </form>
    </div>
{% endblock %}
