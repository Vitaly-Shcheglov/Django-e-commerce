<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Меню</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/bootstrap.min.css' %}">
</head>
<body>
    <nav>
        <ul class="nav nav-pills">
            <li class="nav-item">
                <a class="nav-link" href="{% url 'home' %}">Главная</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="{% url 'add_product' %}">Добавить продукт</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="{% url 'product_list' %}">Список продуктов</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="{% url 'blog_list' %}">Блог</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="{% url 'contacts' %}">Контакты</a>
            </li>
            <li class="nav-item dropdown">
                <a class="nav-link dropdown-toggle" href="#" id="categoriesDropdown" role="button" data-bs-toggle="dropdown" aria-expanded="false">
                    Категории
                </a>
                <ul class="dropdown-menu" aria-labelledby="categoriesDropdown">
                    {% for category in categories %}
                        <li><a class="dropdown-item" href="{% url 'products_in_category' category.pk %}">{{ category.name }}</a></li>
                    {% empty %}
                        <li><a class="dropdown-item" href="#">Нет категорий</a></li>
                    {% endfor %}
                </ul>
            </li>
        </ul>
    </nav>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="{% static 'js/bootstrap.bundle.min.js' %}"></script>
    <script>
        // Используем jQuery noConflict
        var jQuery = jQuery.noConflict();
        jQuery(document).ready(function() {
            // Пример использования jQuery, если потребуется
            jQuery("#categoriesDropdown").on("click", function() {
                // Ваш код здесь, например:
                console.log("Категории нажаты!");
            });
        });
    </script>
</body>
</html>
